<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VIZIO Conjure smoke test</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { display: grid; min-height: 100vh; place-items: center; margin: 0; background: #101820; }
      main { width: min(80vw, 900px); padding: 4rem; text-align: center; border: 4px solid #66d9ef; border-radius: 1rem; }
      h1 { font-size: clamp(2rem, 8vw, 6rem); margin: 0 0 1rem; }
      p { font-size: clamp(1rem, 3vw, 2rem); }
      #remote-log { margin: 2rem auto 0; max-height: 12rem; overflow: auto; padding: 0; text-align: left; font: 1rem/1.5 ui-monospace, monospace; }
      #remote-log li { list-style: none; padding: 0.25rem 0; border-bottom: 1px solid #28404a; }
    </style>
  </head>
  <body>
    <main id="conjure-smoke-marker">
      <h1>CONJURE OK</h1>
      <p>VIZIO Conjure launch smoke test</p>
      <p id="runtime"></p>
      <p id="remote-status">Remote events: waiting for a DOM keyboard event</p>
      <ol id="remote-log" aria-live="polite"></ol>
    </main>
    <script>
      document.querySelector("#runtime").textContent =
        `Loaded ${new Date().toISOString()} · ${navigator.userAgent}`;

      const remoteStatus = document.querySelector("#remote-status");
      const remoteLog = document.querySelector("#remote-log");
      const recentEvents = [];

      function describeRemoteEvent(eventName, event) {
        const key = event.key || "(empty)";
        const code = event.code || "(empty)";
        const repeat = event.repeat ? " repeat" : "";
        return `${eventName}: key=${key} code=${code}${repeat}`;
      }

      function recordRemoteEvent(eventName, event) {
        const description = describeRemoteEvent(eventName, event);
        recentEvents.unshift(description);
        recentEvents.splice(12);
        remoteStatus.textContent = `Remote events received: ${recentEvents.length}`;
        remoteLog.replaceChildren(
          ...recentEvents.map((entry) => {
            const item = document.createElement("li");
            item.textContent = entry;
            return item;
          }),
        );
      }

      // Observe events without preventing the TV runtime's default handling.
      for (const eventName of ["keydown", "keyup", "keypress"]) {
        window.addEventListener(eventName, (event) => recordRemoteEvent(eventName, event), true);
      }
    </script>
  </body>
</html>
